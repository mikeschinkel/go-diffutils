[[item]]
id = "P1"
kind = "deliverable"
statement = "LICENSE holds Mike's MIT text followed by Patrick Mezard's go-difflib copyright line and the full BSD 3-Clause text, all three conditions included"

[[item]]
id = "P2"
kind = "deliverable"
statement = "difflib.go's header comment names BSD 3-Clause, keeps Mezard's copyright line and points to LICENSE"

[[item]]
id = "P3"
kind = "deliverable"
statement = "README.md lists the root, dmp and sgdiff modules, shows how to install each, has a Local Development section on just work and GOWORK=off, and has a License section crediting go-difflib"

[[item]]
id = "P4"
kind = "deliverable"
statement = "dmp/go.mod and sgdiff/go.mod have no replace directive and require root at a pseudo-version of a commit on main"
verify = "go mod edit -json in each shows no Replace; go build and go test pass with GOWORK=off"

[[item]]
id = "P5"
kind = "deliverable"
statement = "Every go.mod is tidy with GOWORK=off"
verify = "go mod tidy -diff reports nothing in root, dmp and sgdiff"

[[item]]
id = "P6"
kind = "deliverable"
statement = "A justfile offers help, work, ensure-valid, test, lint, fmt, vet, tidy, build, clean and ci, finding modules rather than listing them"

[[item]]
id = "P7"
kind = "deliverable"
statement = "just work writes a go.work over every module, and go.work and go.work.sum are ignored by git"

[[item]]
id = "P8"
kind = "deliverable"
statement = ".github/workflows/test.yml runs with GOWORK off, tests root, dmp and sgdiff, and checks every go.mod is tidy"

[[item]]
id = "P9"
kind = "deliverable"
statement = ".github/workflows/release.yml takes a module choice of root, dmp or sgdiff and makes vX.Y.Z for root and <dir>/vX.Y.Z for dmp and sgdiff"

[[item]]
id = "P10"
kind = "deliverable"
statement = "release.yml refuses a module whose declared path is wrong, whose go.mod has a replace, or whose tag already exists, and runs that module's tests with GOWORK off first"

[[item]]
id = "P11"
kind = "deliverable"
statement = "release.yml's notes list commits since that module's previous tag, limited to its directory for dmp and sgdiff, and excluding dmp, sgdiff and .endless for root"

[[item]]
id = "P12"
kind = "deliverable"
statement = ".endless/tasks holds Endless's _harness.sh and _guard.sh unchanged"

[[item]]
id = "P13"
